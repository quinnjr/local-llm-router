[package]
name = "local-llm-router"
version = "0.1.0"
edition = "2024"
description = "Minimalist local proxy routing OpenAI-compatible and Ollama-native API connections to LLM servers on your network, with unified model listing"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quinnjr/local-llm-router"
homepage = "https://github.com/quinnjr/local-llm-router"
readme = "README.md"
keywords = ["llm", "ollama", "openai", "proxy", "router"]
categories = ["network-programming", "command-line-utilities"]
authors = ["Joseph R. Quinn <423821+quinnjr@users.noreply.github.com>"]

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
