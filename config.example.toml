# The admin API (/admin/*) is unauthenticated by design: anyone who can
# reach this port can add/remove backends. On untrusted networks, bind
# 127.0.0.1 below or firewall the port.
[router]
listen = "0.0.0.0:4000"
request_timeout_secs = 600
# state_file = "./state.toml"

# A llama.cpp / vLLM / LM Studio server (OpenAI-compatible)
[[server]]
name = "studio"
url = "http://192.168.1.10:8080"
flavor = "openai"

# An Ollama server
[[server]]
name = "rig"
url = "http://192.168.1.11:11434"
flavor = "ollama"
# models = ["qwen3:8b"]  # optional upstream-name allowlist
